[package]
name = "datluma-mcp"
description = "MCP 服务（标准输入输出）：把打开了 MCP 访问的连接以只读工具交给本机智能体"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
datluma-core.workspace = true
datluma-dialect.workspace = true
datluma-service.workspace = true
rmcp = { version = "=3.10.0", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }


[dev-dependencies]
datluma-service = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["io-util", "rt-multi-thread", "macros"] }
