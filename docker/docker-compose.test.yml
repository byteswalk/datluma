# 驱动集成测试用的数据库。端口与 README 中的环境变量示例一致。
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: datluma
      MYSQL_DATABASE: datluma_test
    ports: ["3306:3306"]
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: datluma
      MARIADB_DATABASE: datluma_test
    ports: ["3307:3306"]
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: datluma
      POSTGRES_DB: datluma_test
    ports: ["5432:5432"]
